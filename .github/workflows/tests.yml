name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic:
    # The interface uses macOS 26 APIs behind availability checks, so the SDK has to know them.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TDLIB_REVISION: 42e6a5259551178d1dab54a22ad96d14bd906e20
    steps:
      - uses: actions/checkout@v4

      # TDLib is not kept in the repository (see vendor/README.md). Building it takes most of an hour, so
      # the result is cached by revision.
      - name: Restore TDLib
        id: tdlib
        uses: actions/cache@v4
        with:
          path: vendor/tdlib
          key: tdlib-${{ env.TDLIB_REVISION }}-macos-arm64-v1

      - name: Build TDLib
        if: steps.tdlib.outputs.cache-hit != 'true'
        run: |
          brew install gperf cmake openssl@3
          git clone https://github.com/tdlib/td.git vendor/td
          git -C vendor/td checkout "$TDLIB_REVISION"
          cmake -S vendor/td -B vendor/td/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DTD_ENABLE_LTO=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/vendor/tdlib"
          cmake --build vendor/td/build --target install -j "$(sysctl -n hw.ncpu)"

      - name: Build the app
        run: swift build -c release --arch arm64

      # The model's logic, fed TDLib-shaped updates with no network: the stand that needs neither a window
      # nor Telegram's servers.
      - name: Logic stand
        run: Harness/run.sh logic
